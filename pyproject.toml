[tool.poetry]
name = "paisa-backend"
version = "0.1.0"
description = "Paisa personal finance tracker - backend API"
authors = ["Darshan <darshan.vankawala@viitor.cloud>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
pyjwt = "^2.9.0"
bcrypt = ">=4.0,<6.0"
redis = "^5.2.0"
celery = { extras = ["redis"], version = "^5.4.0" }
jinja2 = "^3.1.4"
slowapi = "^0.1.9"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = ">=0.10.0,<1.0.0"
isort = "^5.13.2"
mypy = "^1.13.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line length is enforced by black, not worth duplicating here.
# UP043/UP046/UP047: these push PEP 695 generics (`class Foo[T]`, `def f[T](...)`,
# `Generator[X]` with implicit default) which require Python 3.12+ syntax at
# parse time. We deliberately keep the classic `TypeVar`/`Generic[T]` style so
# the codebase stays parseable on slightly older 3.x toolchains during local
# development, even though the target runtime is 3.13.
ignore = ["E501", "UP043", "UP046", "UP047"]

# `Depends(...)`/`Query(...)` as a default argument is FastAPI's own
# documented dependency-injection pattern, not the mutable-default-argument
# bug B008 otherwise correctly warns about - without this, every single
# FastAPI route parameter using Depends() would be a false positive.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["alembic/"]

# Third-party packages below ship no inline type hints and no stubs on PyPI
# (types-apscheduler etc. is either unmaintained or doesn't exist for the
# version pinned here) - silence the import-untyped noise for just these
# modules rather than weakening `strict` globally. (bcrypt ships its own
# py.typed marker, so it needs no override.)
[[tool.mypy.overrides]]
module = ["slowapi.*", "celery.*", "pytesseract", "PIL"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.tasks.reminders"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# NOTE: deliberately NOT setting asyncio_default_fixture_loop_scope="session"
# here. The real fix for async-engine-across-tests breakage is disposing the
# cached engine after every test (see tests/conftest.py's `_clean_database`
# docstring) - an asyncpg connection can't safely survive a *different*
# `run_until_complete()` cycle regardless of event loop scope, so pinning a
# shared loop doesn't actually solve it and isn't needed once the engine
# itself is disposed+recreated per test.
