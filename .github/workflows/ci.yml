name: CI

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [dev, uat]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff
        run: poetry run ruff check .
      - name: Black
        run: poetry run black --check .
      - name: isort
        run: poetry run isort --check-only .
      - name: MyPy
        run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paisa
          POSTGRES_PASSWORD: paisa
          POSTGRES_DB: paisa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paisa -d paisa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://paisa:paisa@localhost:5432/paisa_test
      ENVIRONMENT: test
      # >=32 bytes to avoid PyJWT's InsecureKeyLengthWarning - test-only value.
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run migrations
        run: poetry run alembic upgrade head
      - name: Pytest
        run: poetry run pytest --maxfail=1 -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push — PR/branch validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: paisa-backend:ci
