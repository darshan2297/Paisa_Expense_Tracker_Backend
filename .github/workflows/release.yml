name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/paisa-backend:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/paisa-backend:latest

  deploy:
    needs: [release-please, build-and-push]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        # Render's Web Service is configured (one-time, manual — see docs/DEPLOYMENT_GUIDE.md)
        # to run ghcr.io/<owner>/paisa-backend:latest. Hitting its Deploy Hook tells Render to
        # re-pull that tag and restart. The hook URL itself is the secret — no other auth needed.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set — see docs/DEPLOYMENT_GUIDE.md for one-time Render setup."
            exit 1
          fi
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
